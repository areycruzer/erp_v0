version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hajiri-postgres
    environment:
      POSTGRES_DB: hajiri_db
      POSTGRES_USER: hajiri_user
      POSTGRES_PASSWORD: hajiri_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - hajiri-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hajiri_user -d hajiri_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: hajiri-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hajiri-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: hajiri-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://hajiri_user:hajiri_password@postgres:5432/hajiri_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      ENCRYPTION_KEY: dev-encryption-key-32-chars-long
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hajiri-network
    command: npm run dev

  # Frontend PWA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hajiri-frontend
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - hajiri-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  hajiri-network:
    driver: bridge